services:
  - type: web
    name: flask-school-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flask-school-db
          property: connectionString
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
      - key: ENABLE_SOCKETIO
        value: "1"
      - key: IMPORT_CURRENT_DATA
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.4

databases:
  - name: flask-school-db
