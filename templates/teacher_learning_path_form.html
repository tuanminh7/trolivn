{% extends "layout.html" %}
{% block title %}{{ 'Chỉnh sửa' if path else 'Upload' }} lộ trình{% endblock %}
{% block content %}
  <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
    <div>
      <h2 class="section-title">{{ 'Chỉnh sửa lộ trình' if path else 'Upload lộ trình mới' }}</h2>
    </div>
    <a href="{{ url_for('teacher_learning_paths') }}" class="btn btn-outline-secondary align-self-lg-start">Quay lại</a>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Ngành/nghề</label>
        <input name="title" class="form-control" value="{{ path.title if path else '' }}" placeholder="Ví dụ: Lập trình viên">
      </div>
      <div class="col-md-6">
        <label class="form-label">Mô tả ngắn</label>
        <input name="summary" class="form-control" value="{{ path.summary if path else '' }}" placeholder="Phát triển phần mềm, web, ứng dụng di động">
      </div>
      <div class="col-md-3">
        <label class="form-label">Icon</label>
        <input name="icon" class="form-control" value="{{ path.icon if path else '' }}" placeholder="</>">
      </div>
      <div class="col-md-3">
        <label class="form-label">Màu</label>
        <select name="color" class="form-select">
          {% for color in ['purple', 'green', 'yellow', 'orange', 'pink', 'blue'] %}
            <option value="{{ color }}" {% if path and path.color == color %}selected{% endif %}>{{ color }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Mục tiêu hiển thị</label>
        <input name="goal_label" class="form-control" value="{{ path.goal_label if path else '' }}" placeholder="Lập trình viên">
      </div>
      <div class="col-md-3">
        <label class="form-label">% hoàn thành mẫu</label>
        <input name="completion_percent" type="number" min="0" max="100" class="form-control" value="{{ path.completion_percent if path else 35 }}">
      </div>
      <div class="col-12">
        <label class="form-label">Timeline theo năm học (JSON)</label>
        <textarea name="stages_json" class="form-control font-monospace" rows="16">{{ stages_json }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label">Kỹ năng đang rèn (JSON)</label>
        <textarea name="skills_json" class="form-control font-monospace" rows="8">{{ skills_json }}</textarea>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">Lưu lộ trình</button>
      <a href="{{ url_for('teacher_learning_paths') }}" class="btn btn-outline-secondary">Hủy</a>
    </div>
  </form>
{% endblock %}
