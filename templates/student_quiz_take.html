{% extends "layout.html" %}
{% block title %}Làm trắc nghiệm{% endblock %}
{% block content %}
  <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
    <div>
      <p class="text-primary fw-semibold mb-1">Đang làm bài</p>
      <h2 class="section-title">{{ topic.title }}</h2>
    </div>
    <a href="{{ url_for('student_quizzes') }}" class="btn btn-outline-secondary align-self-lg-start">Quay lại</a>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="d-flex flex-column gap-3">
      {% for question in questions %}
        <article class="border rounded p-3">
          <h5 class="fw-bold mb-3">Câu {{ loop.index }}. {{ question.question_text }}</h5>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="quiz-option">
                <input type="radio" name="question_{{ question.id }}" value="a">
                <span>A. {{ question.option_a }}</span>
              </label>
            </div>
            <div class="col-md-6">
              <label class="quiz-option">
                <input type="radio" name="question_{{ question.id }}" value="b">
                <span>B. {{ question.option_b }}</span>
              </label>
            </div>
            <div class="col-md-6">
              <label class="quiz-option">
                <input type="radio" name="question_{{ question.id }}" value="c">
                <span>C. {{ question.option_c }}</span>
              </label>
            </div>
            <div class="col-md-6">
              <label class="quiz-option">
                <input type="radio" name="question_{{ question.id }}" value="d">
                <span>D. {{ question.option_d }}</span>
              </label>
            </div>
          </div>
        </article>
      {% endfor %}
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">Nộp bài và xem kết quả</button>
      <a href="{{ url_for('student_quizzes') }}" class="btn btn-outline-secondary">Hủy</a>
    </div>
  </form>
{% endblock %}
